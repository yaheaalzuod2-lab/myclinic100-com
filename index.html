<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyClinic100</title>
<style>
:root{--p:#0a192f;--s:#64ffda;--bg:#f8fafc}
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:#1e293b}
.header{background:var(--p);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px}.btn{background:rgba(255,255,255,.15);border:0;color:#fff;padding:8px 14px;border-radius:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.card b{font-size:26px;display:block;color:var(--p)}
.chat{background:#fff;margin:0 14px 14px;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.chat-h{padding:12px;font-weight:700;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
.msg{padding:10px 14px;display:flex;gap:10px}.msg.me{flex-direction:row-reverse}
.bubble{padding:10px 14px;border-radius:18px;max-width:75%}.other .bubble{background:#f1f5f9}.me .bubble{background:var(--p);color:#fff}
.panel{position:fixed;top:65px;left:14px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.2);display:none;z-index:99}
.panel button{width:32px;height:32px;border-radius:50%;border:2px solid #fff;margin:4px}
</style>
</head>
<body>
<div class="header"><div class="logo">MyClinic100</div><button class="btn" onclick="document.getElementById('c').style.display=document.getElementById('c').style.display=='block'?'none':'block'">🎨 الألوان</button></div>
<div id="c" class="panel">
<button style="background:#0a192f" onclick="setT('#0a192f','#64ffda')"></button>
<button style="background:#065f46" onclick="setT('#065f46','#6ee7b7')"></button>
<button style="background:#5b21b6" onclick="setT('#5b21b6','#a78bfa')"></button>
<button style="background:#9f1239" onclick="setT('#9f1239','#fda4af')"></button>
<button style="background:#ea580c" onclick="setT('#ea580c','#fdba74')"></button>
</div>
<div class="stats"><div class="card"><b>142</b>محادثة اليوم</div><div class="card"><b>98</b>مريض نشط</div><div class="card"><b>96%</b>رضا العملاء</div></div>
<div class="chat"><div class="chat-h"><span>محادثة - أحمد السالم</span><span style="color:#22c55e;font-size:12px">● متصل</span></div><div class="msg other"><div class="bubble">مرحبا دكتور، عندي موعد اليوم؟</div></div><div class="msg me"><div class="bubble">أهلا أحمد، نعم موعدك الساعة 4 العصر</div></div><div class="msg other"><div class="bubble">تمام، شكرا 🙏</div></div></div>
<div style="text-align:center;padding:18px"><a href="https://wa.me/962790240431" style="background:var(--p);color:#fff;padding:12px 28px;border-radius:30px;text-decoration:none;display:inline-block">تواصل واتساب - 89 دينار</a><p style="font-size:11px;color:#64748b;margin-top:8px">تجربة 7 أيام مجانا | 3 يوزر واتساب رسمي</p></div>
<script>function setT(p,s){document.documentElement.style.setProperty('--p',p);document.documentElement.style.setProperty('--s',s);localStorage.setItem('p',p);localStorage.setItem('s',s)}let pp=localStorage.getItem('p');if(pp)setT(pp,localStorage.getItem('s'))</script>
</body>
</html>
