<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyClinic100 الاردن</title>
<style>body{margin:0;font-family:system-ui;background:#f1f5f9} .header{background:#0a3d62;color:#fff;padding:18px;text-align:center} .card{background:#fff;margin:12px;padding:16px;border-radius:12px} select,input{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:8px} .btn{background:#0a3d62;color:#fff;padding:12px;border-radius:8px;border:0;width:100%;margin-top:10px} iframe{width:100%;height:300px;border:0;border-radius:12px;margin-top:10px}</style>
</head>
<body>
<div class="header"><h2>🇯🇴 MyClinic100 - الأردن</h2><p>لوحة تحكم العيادة</p></div>
<div class="card">
<label>📍 اختر مدينتك:</label>
<select id="city" onchange="updateMap()">
<option value="Amman, Jordan">عمان</option>
<option value="Zarqa, Jordan">الزرقاء</option>
<option value="Irbid, Jordan">اربد</option>
<option value="Aqaba, Jordan">العقبة</option>
<option value="Salt, Jordan">السلط</option>
<option value="Madaba, Jordan">مادبا</option>
<option value="Jerash, Jordan">جرش</option>
<option value="Ajloun, Jordan">عجلون</option>
<option value="Karak, Jordan">الكرك</option>
<option value="Maan, Jordan">معان</option>
<option value="Mafraq, Jordan">المفرق</option>
</select>
<input id="address" type="text" placeholder="عنوان العيادة بالضبط" oninput="updateMap()">
<button class="btn" onclick="updateMap()">تحديث الخريطة</button>
<iframe id="map" src="https://maps.google.com/maps?q=Amman,Jordan&z=12&output=embed"></iframe>
</div>
<script>function updateMap(){var city=document.getElementById('city').value;var addr=document.getElementById('address').value;var q=addr?addr+', '+city:city;document.getElementById('map').src='https://maps.google.com/maps?q='+encodeURIComponent(q)+'&z=14&output=embed'}</script>
</body>
</html>
